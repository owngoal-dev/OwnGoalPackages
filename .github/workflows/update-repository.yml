name: Build and Deploy APT Repository

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-repository.yml"
      - "assets/**"
      - "debs/**"
      - "scripts/fetch-packages.sh"
      - "scripts/update-repository.sh"
      - "CNAME"
      - "CydiaIcon.png"
      - "index.html"
      - "manifest.json"
  schedule:
    # Pick up new upstream releases once a day.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils xz-utils jq

      - name: Build repository
        env:
          # PACKAGE_FETCH_TOKEN reaches releases in private source repositories;
          # the default token only raises the public API rate limit.
          PACKAGE_FETCH_TOKEN: ${{ secrets.PACKAGE_FETCH_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./scripts/update-repository.sh

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Verify deployed package index hashes
        env:
          REPOSITORY_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          verification_dir="$(mktemp -d)"
          trap 'rm -rf -- "$verification_dir"' EXIT
          mkdir "$verification_dir/indexes"

          repository_url="${REPOSITORY_URL%/}"
          curl --fail --silent --show-error \
            "$repository_url/Release?deployment=$GITHUB_SHA" \
            --output "$verification_dir/Release"

          awk '
            /^SHA256:$/ {
              in_sha256 = 1
              next
            }

            /^[A-Za-z0-9]+:$/ {
              in_sha256 = 0
            }

            in_sha256 && $3 ~ /^Packages(\.[A-Za-z0-9]+)?$/ {
              print $1 "  " $3
            }
          ' "$verification_dir/Release" > "$verification_dir/checksums"

          if [[ ! -s "$verification_dir/checksums" ]]; then
            echo "Release does not contain any package indexes." >&2
            exit 1
          fi

          # The CDN in front of the pages deployment can serve a stale
          # index for a little while after a successful deploy (the
          # Release above is fetched with a cache-buster; the indexes are
          # deliberately fetched the way a real client fetches them). So
          # the verification is tried up to three times, at least thirty
          # seconds apart, before it is called a failure.
          verify_once() {
            rm -rf -- "$verification_dir/indexes"
            mkdir "$verification_dir/indexes"
            while read -r _ index_name; do
              curl --fail --silent --show-error \
                "$repository_url/$index_name" \
                --output "$verification_dir/indexes/$index_name" || return 1
            done < "$verification_dir/checksums"
            (cd "$verification_dir/indexes" && sha256sum --check "$verification_dir/checksums")
          }

          for attempt in 1 2 3; do
            if verify_once; then
              exit 0
            fi
            if [[ "$attempt" -lt 3 ]]; then
              echo "attempt $attempt did not match (the CDN can lag the deploy); retrying in 30s" >&2
              sleep 30
            fi
          done
          echo "package indexes still do not match the Release after 3 attempts" >&2
          exit 1
